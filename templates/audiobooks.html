<!DOCTYPE html>
<html lang="en">
<head>
  <!-- include: head title="Audiobooks — Hondana" -->
  <link rel="stylesheet" href="/static/audiobooks.css">
  <link rel="shortcut icon" href="/static/favicon.ico">
</head>
<body class="layout">
  <!-- include: shell active=audiobooks -->
    <header>
      <div class="header-row">
        <!-- include: header title="Audiobooks" -->
        <span id="count" class="count-badge"></span>
        <div class="search-box">
          <span class="search-dot" aria-hidden="true"></span>
          <input type="search" id="q" placeholder="Search title or author…" autocomplete="off">
        </div>
        <!-- Mobile-only: icon button beside search that collapses the controls
             row below, so the auto-hide-on-scroll toolbar isn't full of
             controls every time it reappears. No-op above 639px (nav.js/app.css). -->
        <button type="button" class="btn toolbar-toggle" id="toolbar-toggle" aria-label="Filters and sort" title="Filters &amp; sort" aria-expanded="false" aria-controls="controls">
          <span class="mi" aria-hidden="true">tune</span>
        </button>
      </div>
      <div class="controls" id="controls">
        <!-- Availability: segmented pills mirror the hidden #avail select
             (wired in nav.js; matches() reads #avail as before). -->
        <div class="seg" data-for="avail" role="group" aria-label="Availability">
          <button type="button" class="seg-btn active" data-val="">All</button>
          <button type="button" class="seg-btn" data-val="local" title="Has at least one local file">Has local</button>
          <button type="button" class="seg-btn" data-val="full" title="Every volume downloaded">Fully local</button>
          <button type="button" class="seg-btn" data-val="missing" title="No local files yet">Audible only</button>
          <button type="button" class="seg-btn" data-val="details" title="Files whose details were guessed from the file name" hidden>Needs details</button>
        </div>
        <select id="avail" class="sr-only" aria-hidden="true" tabindex="-1">
          <option value="">All</option>
          <option value="local">Has local files</option>
          <option value="full">Fully local</option>
          <option value="missing">Audible only</option>
          <option value="details">Needs details</option>
        </select>

        <label class="sort-pill">
          <span class="sort-ic mi" aria-hidden="true">sell</span>
          <select id="genre" aria-label="Genre">
            <option value="">All genres</option>
          </select>
        </label>

        <label class="sort-pill">
          <span class="sort-ic mi" aria-hidden="true">swap_vert</span>
          <select id="sort" aria-label="Sort">
            <option value="series">Series</option>
            <option value="level">Natively level</option>
            <option value="author">Author</option>
            <option value="volumes">Volume count</option>
          </select>
        </label>

        <div class="controls-right">
          <button id="manage-btn" class="btn manage-btn" aria-pressed="false"><span class="mi" aria-hidden="true">edit</span>Edit</button>
        </div>
      </div>
    </header>

    <main id="grid" class="grid"></main>

    <script src="/static/search.js"></script>
    <script src="/static/audiobooks.js"></script>
    <script src="/static/nav.js"></script>
  </div>

</body>
</html>
