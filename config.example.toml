# Hondana's settings file. Every key is optional: delete what you don't need and
# the default applies. Copy it to config.toml (next to the code, or in Hondana's
# home folder) and edit it for your machine. See docs/configuration.md for the
# home folder, the HONDANA_* environment variables that override any key, and
# `uv run cli.py config`, which prints what is in effect and where it came from.
# Relative paths are relative to this file's folder.

# Folder that holds your .epub files (scanned recursively). Default: <home>/books
# epub_dir = "/path/to/EPUBs"

# Where indices, covers, profiles and saved settings are written. Default: <home>/data
# data_dir = "./data"

# Folders scanned for audiobooks (.m4b files, or a folder of .mp3s as one book).
# The FIRST is the canonical root: new audiobooks are filed there, and
# `cli.py consolidate` moves everything into it. Default: ["<home>/audiobooks"]
# audiobook_dirs = ["/path/to/Audiobooks"]

# Optional: a folder to drop new EPUBs and audiobooks into. Hondana files what it
# finds there once it has stopped changing for a minute (see docs/audiobooks.md).
# It can't be inside the EPUB or audiobook folders. Unset = no inbox. Set it in the
# [inbox] table below.

# Folder of your own Yomitan dictionary zips (Jitendex, a monolingual dictionary,
# Kanjium pitch, frequency lists), hosted to Hondana for iPhone. Personal and
# often not redistributable. Default: <data_dir>/dicts
# dicts_dir = "./data/dicts"

# Optional base layer of the audiobook catalog: a JSON object keyed by Audible
# ASIN. Leave it absent to start empty; the `catalog` stage then pulls a row for
# every `[ASIN]` in your audiobook file names. Default: <data_dir>/audiobook_catalog_base.json
# audiobook_data = "./data/audiobook_catalog_base.json"

# Natively levels for the audiobook catalog (filled by `enrich-audiobooks`).
# Default: <data_dir>/natively_levels.json
# audiobook_natively = "./data/natively_levels.json"

# Web server bind address and port. 0.0.0.0 lets your phone reach it on the LAN;
# 127.0.0.1 is this machine only (use that behind a reverse proxy).
host = "0.0.0.0"
port = 8000

# Google Books API key for genres/descriptions by ISBN (or GOOGLE_BOOKS_API_KEY
# in the environment / .env).
# google_books_api_key = ""

[audible]
# The Audible store your audiobooks are bought from: jp, us, uk, de, fr, ca, au,
# in, it or es. Book details are looked up (by ASIN) and searched there.
# marketplace = "jp"

[inbox]
# dir = "/path/to/Inbox"

[natively]
# Seconds between learnnatively.com requests (be polite).
delay = 0.4
# Minimum title-similarity (0-1) to accept an item match.
min_score = 0.55

[xref]
# Minimum title/series-similarity (0-1) to link an audiobook.
min_score = 0.62

[alignment]
# Audio↔text sync: the command that aligns ONE audio file to the book's
# text and writes an .srt into {out}. {audio} is the audio file, {text} a
# one-sentence-per-line .txt of the book, {out} an empty folder. Run without a
# shell, once per file (an mp3 folder runs it per mp3). Not part of the
# automatic chain; empty = "generate" says so instead of running. Example with
# the Apple Silicon fork (helica1/subplz-mac), installed outside this project:
#   subplz_cmd = "/path/to/subplz-mac/.venv/bin/subplz sync --audio {audio} --text {text} --output-dir {out} --lang ja --model turbo --mlx --respect-grouping"
# Without a GPU (or MLX) a long audiobook takes hours: leave this empty on that
# server and run `cli.py align-remote <book> --server http://...` on a machine
# that has the GPU (set subplz_cmd in ITS config); /api/books/{id}/alignment
# also takes an SRT made any other way.
subplz_cmd = ""

[discovery]
# Hondana for iPhone finds the server over Bonjour (`_hondana._tcp`) while
# `cli.py serve` runs; /profile also shows the address and a QR code. Set
# enabled = false to stop advertising.
enabled = true
# Behind a reverse proxy (host = "127.0.0.1") nothing is advertised unless you
# say which port the PROXY listens on, e.g. 80. Leave unset when the app binds
# the LAN itself: the bind port is announced.
# advertise_port = 80
# A proxy that only serves one Host name (nginx `server_name`) refuses the
# advert's own `<name>-hondana.local`. Name the one it answers to and the app
# connects to that instead, e.g. "books.local".
# advertise_host = "books.local"

[data_mirror]
# Off-machine backup of the hand-curated data/ files (profiles, known words,
# read books, and the pairing/series/genre/title overrides + audiobook prune
# list — see epublib/data_mirror.py), none reliably backed up otherwise, to a
# private git repo, via `cli.py push`. Turn it on only on the machine that
# holds your real library: the files are keyed to its book_ids.
# See docs/running-a-server.md#backups.
publish = false
# Local clone of the private repo that `cli.py push` commits into.
# path = "/path/to/hondana-backup"
