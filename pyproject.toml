[project]
name = "hondana"
version = "0.1.0"
description = "A self-hosted library for learning Japanese from your own EPUBs and audiobooks"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "pykakasi>=2.2",
    "python-multipart>=0.0.32",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "wordfreq>=3.1.1",
    "mecab-python3>=1.0.10",
    "ipadic>=1.0.0",
    "pillow>=12.3.0",
    "spacy>=3.8.14",
    "en-core-web-sm",
    "genanki>=0.13.1",
    "zeroconf>=0.151.5",
    "segno>=1.6.6",
]

[project.scripts]
hondana = "epublib.cli:main"

[project.urls]
Homepage = "https://github.com/bry5an/hondana"

# Installed editable (uv's default), so epublib/ keeps finding templates/ and
# static/ next to it in the checkout.
[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epublib"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
